# Training, HPO and thesis evaluation on prepared datasets.
# Prefer the matching explicit lock for identical transitive package builds.
name: tii-thesis-macos-arm64
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12.9
  - pytorch=2.5.1=cpu_generic_py312_h8a46fbe_16
  - numpy=2.2.4
  - scipy=1.14.1
  - pandas=2.2.3
  - scikit-learn=1.6.1
  - optuna=4.1.0
  - torchdiffeq=0.2.2
  - pyyaml=6.0.2
  - joblib=1.4.2
  - sqlalchemy=2.0.40
  - psutil=6.1.1
  - pynvml=12.0.0
  - nvidia-ml-py=12.570.86
  - tqdm=4.67.1
  - matplotlib-base=3.10.1
  - plotly=5.24.1
