chosen_device: cuda
dataset:
  batch_size: 64
  dim_x: 1
  dim_y: 1
  history_length: 1
  name: FractionalBenchmarkForcing
  sample_mode: full_trajectory
  scaler: none
  scaler_params_content: null
  task: forecasting
experiment:
  batch_size: 512
  hyperparameter_tuning:
    jobs_per_gpu: 1
    min_epochs: 500
    n_jobs: -1
    n_trials: 100
    num_epochs: 750
    reduction_factor: 2
    use_pruner: false
  num_epochs: 1000
  seed: 42
  wanted_device: cuda
model:
  activation_ODE:
    default: relu
    search_space:
      choices:
      - relu
      - leaky_relu
      - tanh
      - elu
      - sigmoid
      - none
      type: categorical
  adjoint:
    default: false
  atol:
    default: 0.0001
  augmentation_type: zero
  augmented_dim_ODE:
    default: 1
    search_space:
      high: 16
      low: 1
      step: 1
      type: int
  fallback_on_nan_dt:
    default: true
  fallback_solver:
    default: rk4
  fallback_step_size:
    default: 0.001
  hidden_size_ODE:
    default: 100
    search_space:
      high: 150
      low: 8
      step: 8
      type: int
  hidden_size_encoder:
    default: 64
    search_space:
      high: 150
      low: 8
      step: 8
      type: int
  homogeneous:
    default: false
  include_time: true
  interp_mode:
    default: linear
  learning_rate:
    default: 0.001
    search_space:
      high: 0.01
      low: 1.0e-05
      type: loguniform
  n_layers_hidden_ODE:
    default: 2
    search_space:
      choices:
      - 1
      - 2
      - 3
      - 4
      type: categorical
  name: M3AdaptiveNeuralODE
  num_layers_encoder:
    default: 1
    search_space:
      choices:
      - 1
      - 2
      - 3
      type: categorical
  pretraining_epochs:
    default: 0
  pretraining_lr:
    default: 0
  pretraining_scaling:
    default: true
  rnn_type:
    default: lstm
  rtol:
    default: 1.0e-07
  scaler_params: null
  solver:
    default: dopri5
