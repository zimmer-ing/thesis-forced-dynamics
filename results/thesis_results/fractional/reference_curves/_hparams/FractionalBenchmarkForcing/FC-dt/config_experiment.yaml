chosen_device: cuda
dataset:
  batch_size: 64
  dim_x: 1
  dim_y: 1
  forecast_length: 400
  history_length: 1
  name: FractionalBenchmarkForcing
  sample_mode: full_trajectory
  scaler: none
  scaler_params_content: null
  task: forecasting
experiment:
  batch_size: 512
  failure_policy:
    divergent_prediction_is_failure: true
    max_abs_loss: 1000000000000.0
    max_abs_prediction: 1000000.0
    non_finite_is_failure: true
  hyperparameter_tuning:
    jobs_per_gpu: 1
    min_epochs: 500
    n_jobs: -1
    n_trials: 100
    num_epochs: 750
    reduction_factor: 2
    use_pruner: false
  num_epochs: 1000
  seed: 42
  wanted_device: cuda
model:
  activation:
    default: ReLU
    search_space:
      choices:
      - ReLU
      - LeakyReLU
      - ELU
      - Sigmoid
      type: categorical
  dropout:
    default: 0.0
  hidden_layers:
    default: 2
    search_space:
      high: 4
      low: 0
      step: 1
      type: int
  hidden_width:
    default: 512
    search_space:
      high: 1024
      low: 256
      step: 128
      type: int
  layernorm:
    default: false
    search_space:
      choices:
      - true
      - false
      type: categorical
  learning_rate:
    default: 0.001
    search_space:
      high: 0.01
      low: 1.0e-05
      type: loguniform
  name: FCSimple
  scaler_params: null
