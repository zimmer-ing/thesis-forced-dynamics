chosen_device: cuda
dataset:
  batch_size: 64
  dim_x: 1
  dim_y: 1
  history_length: 1
  name: FractionalBenchmarkForcing
  sample_mode: full_trajectory
  scaler: none
  scaler_params_content: null
  task: forecasting
experiment:
  batch_size: 512
  failure_policy:
    divergent_prediction_is_failure: true
    max_abs_loss: 1000000000000.0
    max_abs_prediction: 1000000.0
    non_finite_is_failure: true
  hyperparameter_tuning:
    jobs_per_gpu: 1
    min_epochs: 500
    n_jobs: -1
    n_trials: 100
    num_epochs: 750
    reduction_factor: 2
    use_pruner: false
  num_epochs: 1000
  seed: 42
  wanted_device: cuda
model:
  activation_FDE:
    default: relu
    search_space:
      choices:
      - relu
      - leaky_relu
      - tanh
      - elu
      - sigmoid
      - none
      type: categorical
  alpha:
    default: 0.7
  h:
    default: null
  hidden_size_FDE:
    default: 100
    search_space:
      high: 150
      low: 8
      step: 8
      type: int
  homogeneous:
    default: false
  include_time: true
  interp_mode:
    default: linear
  learn_alpha:
    default: false
  learning_rate:
    default: 0.001
    search_space:
      high: 0.01
      low: 1.0e-05
      type: loguniform
  n_layers_hidden_FDE:
    default: 2
    search_space:
      choices:
      - 1
      - 2
      - 3
      - 4
      type: categorical
  name: NeuralFDEFixedAlpha
  scaler_params: null
