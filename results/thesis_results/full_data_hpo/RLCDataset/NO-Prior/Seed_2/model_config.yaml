chosen_device: cuda
dataset:
  batch_size: 256
  dim_x: 2
  dim_y: 4
  forecast_length: 50
  history_length: 5
  name: RLCDataset
  scaler_params_content: null
  stride: 25
experiment:
  batch_size: 512
  failure_policy:
    divergent_prediction_is_failure: true
    max_abs_loss: 1000000000000.0
    max_abs_prediction: 1000000.0
    non_finite_is_failure: true
  hyperparameter_tuning:
    jobs_per_gpu: 1
    min_epochs: 500
    n_jobs: -1
    n_trials: 100
    num_epochs: 500
    reduction_factor: 2
    use_pruner: false
  num_epochs: 1000
  seed: 42
  wanted_device: cuda
model:
  activation_ODE: relu
  adjoint: false
  atol: 0.0001
  fallback_on_nan_dt: false
  fallback_solver: rk4
  fallback_step_size: 0.001
  has_physics: true
  hidden_size_ODE: 144
  homogeneous: false
  include_time: true
  interp_mode: linear
  learning_rate: 0.005407276206118684
  n_layers_hidden_ODE: 1
  name: M2AdaptiveNeuralODE
  physics_params:
    C1:
      initial_value: 0.0005
      learn_as_factor: true
      learnable: true
    C2:
      initial_value: 0.0002
      learn_as_factor: true
      learnable: true
    L1:
      initial_value: 9.0e-05
      learn_as_factor: true
      learnable: true
    L2:
      initial_value: 0.00025
      learn_as_factor: true
      learnable: true
    R1:
      initial_value: 0.35
      learn_as_factor: true
      learnable: true
    R2:
      initial_value: 0.2
      learn_as_factor: true
      learnable: true
    slope_c1:
      initial_value: 0.05
      learn_as_factor: true
      learnable: true
    slope_c2:
      initial_value: 0.05
      learn_as_factor: true
      learnable: true
    slope_l1:
      initial_value: 0.5
      learn_as_factor: true
      learnable: true
    slope_l2:
      initial_value: 0.5
      learn_as_factor: true
      learnable: true
  pretraining_epochs: 1000
  pretraining_lr: 0.00017552484194262538
  pretraining_scaling: true
  rtol: 1.0e-07
  scaler_params: null
  solver: dopri5
