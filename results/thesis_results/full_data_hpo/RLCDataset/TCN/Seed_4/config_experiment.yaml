chosen_device: cuda
dataset:
  batch_size: 256
  dim_x: 2
  dim_y: 4
  forecast_length: 50
  history_length: 5
  name: RLCDataset
  scaler_params_content: null
  stride: 25
experiment:
  batch_size: 512
  hyperparameter_tuning:
    jobs_per_gpu: 1
