chosen_device: cuda
dataset:
  batch_size: 256
  dim_x: 2
  dim_y: 4
  forecast_length: 50
  history_length: 5
  name: RLCDataset
  scaler_params_content: null
  stride: 25
experiment:
  batch_size: 512
  failure_policy:
    divergent_prediction_is_failure: true
    max_abs_loss: 1000000000000.0
    max_abs_prediction: 1000000.0
    non_finite_is_failure: true
  hyperparameter_tuning:
    jobs_per_gpu: 1
    min_epochs: 500
    n_jobs: -1
    n_trials: 100
    num_epochs: 500
    reduction_factor: 2
    use_pruner: false
  num_epochs: 1000
  seed: 42
  wanted_device: cuda
model:
  dropout:
    default: 0.0
  hidden_size:
    default: 128
    search_space:
      high: 512
      low: 8
      step: 8
      type: int
  learning_rate:
    default: 0.001
    search_space:
      high: 0.01
      low: 1.0e-06
      type: loguniform
  name: GRUSeq2Seq
  num_layers:
    default: 2
    search_space:
      high: 5
      low: 1
      step: 1
      type: int
  scaler_params: null
