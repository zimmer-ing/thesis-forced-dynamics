chosen_device: cuda
dataset:
  batch_size: 256
  dim_x: 1
  dim_y: 1
  forecast_length: 500
  history_length: 50
  name: SMDSystem
  scaler_params_content: null
  stride: -1
  zero_initial_conditions: false
experiment:
  batch_size: 512
  failure_policy:
    divergent_prediction_is_failure: true
    max_abs_loss: 1000000000000.0
    max_abs_prediction: 1000000.0
    non_finite_is_failure: true
  hyperparameter_tuning:
    jobs_per_gpu: 1
    min_epochs: 500
    n_jobs: -1
    n_trials: 100
    num_epochs: 750
    reduction_factor: 2
    use_pruner: false
  num_epochs: 1000
  seed: 42
  wanted_device: cuda
model:
  LP_trafo_type:
    default: FFLT
    search_space:
      choices:
      - FFLT
      - DLT
      type: categorical
  grid_limits:
    default:
    - -1
    - 1
  ilt_alpha:
    default: 0.002
    search_space:
      high: 0.0101
      low: 1.0e-05
      step: 5.0e-05
      type: float
  ilt_scale:
    default: 2.6
    search_space:
      high: 3
      low: 1
      step: 0.1
      type: float
  ilt_shift:
    default: 8.0
    search_space:
      high: 10.0
      low: 0.5
      step: 0.1
      type: float
  ilt_terms:
    default: 77
    search_space:
      high: 79
      low: 33
      step: 2
      type: int
  is_RNN_hidden_dim:
    default: 40
    search_space:
      high: 64
      low: 8
      step: 4
      type: int
  is_RNN_num_layers:
    default: 3
    search_space:
      high: 5
      low: 1
      step: 1
      type: int
  is_order_dim:
    default: 1
    search_space:
      high: 4
      low: 1
      step: 1
      type: int
  laplace_scaling_factor:
    default: 60.0
    search_space:
      high: 500.0
      low: 10
      step: 10.0
      type: float
  learning_rate:
    default: 0.000287
    search_space:
      high: 0.01
      low: 1.0e-06
      type: loguniform
  name: LaplaceNetFull
  response_only_history:
    default: false
  scaler_params: null
  steps:
    default: 1
    search_space:
      high: 10
      low: 1
      step: 1
      type: int
  tf_activation:
    default: tanh
    search_space:
      choices:
      - tanh
      - sigmoid
      - softsign
      - silu
      type: categorical
  tf_hidden_dim:
    default: 128
    search_space:
      high: 192
      low: 32
      step: 16
      type: int
  tf_num_hidden_layers:
    default: 4
    search_space:
      high: 6
      low: 1
      step: 1
      type: int
  tf_process_all_terms:
    default: true
  use_laplace_scaling:
    default: true
