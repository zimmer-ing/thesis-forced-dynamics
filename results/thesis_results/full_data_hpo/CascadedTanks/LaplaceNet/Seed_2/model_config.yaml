chosen_device: cuda
dataset:
  batch_size: 128
  dim_x: 1
  dim_y: 1
  forecast_length: 150
  history_length: 10
  name: CascadedTanks
  scaler: minmax
  scaler_params_content: null
  stride: 5
experiment:
  batch_size: 512
  failure_policy:
    divergent_prediction_is_failure: true
    max_abs_loss: 1000000000000.0
    max_abs_prediction: 1000000.0
    non_finite_is_failure: true
  gpu_memory_limit_gb: 40.0
  hyperparameter_tuning:
    jobs_per_gpu: 1
    min_epochs: 500
    n_jobs: -1
    n_trials: 100
    num_epochs: 750
    reduction_factor: 2
    use_pruner: false
  num_epochs: 1000
  seed: 42
  wanted_device: cuda
model:
  LP_trafo_type: FFLT
  grid_limits:
  - -1
  - 1
  ilt_alpha: 0.00296
  ilt_scale: 2.2
  ilt_shift: 4.9
  ilt_terms: 77
  is_RNN_hidden_dim: 60
  is_RNN_num_layers: 4
  is_order_dim: 1
  laplace_scaling_factor: 80.0
  learning_rate: 0.007157454404343706
  name: LaplaceNetFull
  response_only_history: false
  scaler_params:
    exclude_columns:
    - time_s
    - source_id
    scaled_columns:
    - pump_voltage
    - lower_tank_level
