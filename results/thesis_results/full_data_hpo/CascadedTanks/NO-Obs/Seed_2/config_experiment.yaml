chosen_device: cuda
dataset:
  batch_size: 128
  dim_x: 1
  dim_y: 1
  forecast_length: 150
  history_length: 10
  name: CascadedTanks
  scaler: minmax
  scaler_params_content: null
  stride: 5
experiment:
  batch_size: 512
  failure_policy:
    divergent_prediction_is_failure: true
    max_abs_loss: 1000000000000.0
    max_abs_prediction: 1000000.0
    non_finite_is_failure: true
  hyperparameter_tuning:
    jobs_per_gpu: 1
    min_epochs: 500
    n_jobs: -1
    n_trials: 100
    num_epochs: 750
    reduction_factor: 2
    use_pruner: false
  num_epochs: 1000
  seed: 42
  wanted_device: cuda
model:
  activation_ODE:
    default: relu
    search_space:
      choices:
      - relu
      - leaky_relu
      - tanh
      - elu
      - sigmoid
      - none
      type: categorical
  adjoint:
    default: false
  atol:
    default: 0.0001
  fallback_on_nan_dt:
    default: false
  fallback_solver:
    default: rk4
  fallback_step_size:
    default: 0.01
  hidden_size_ODE:
    default: 100
    search_space:
      high: 150
      low: 8
      step: 8
      type: int
  homogeneous:
    default: false
  include_time:
    default: false
    search_space:
      choices:
      - true
      - false
      type: categorical
  interp_mode:
    default: linear
  learning_rate:
    default: 0.001
    search_space:
      high: 0.01
      low: 1.0e-05
      type: loguniform
  n_layers_hidden_ODE:
    default: 2
    search_space:
      choices:
      - 1
      - 2
      - 3
      - 4
      type: categorical
  name: M1AdaptiveNeuralODE
  pretraining_epochs:
    default: 100
    search_space:
      high: 500
      low: 50
      step: 50
      type: int
  pretraining_lr:
    default: 0.001
    search_space:
      high: 0.01
      low: 1.0e-05
      type: loguniform
  pretraining_scaling:
    default: true
  rtol:
    default: 1.0e-07
  scaler_params:
    exclude_columns:
    - time_s
    - source_id
    scaled_columns:
    - pump_voltage
    - lower_tank_level
    scaler_type: minmax
    scaling_details:
      lower_tank_level:
        data_max: 10.0
        data_min: 2.911573968108644
        data_range: 7.0884260318913554
        min: -0.41075041977009513
        min_: -0.41075041977009513
        scale: 0.1410750419770095
        scale_: 0.1410750419770095
      pump_voltage:
        data_max: 6.471210099744564
        data_min: 1.2099252459897365
        data_range: 5.261284853754828
        min: -0.22996763711173093
        min_: -0.22996763711173093
        scale: 0.19006764085132719
        scale_: 0.19006764085132719
  solver:
    default: dopri5
