chosen_device: cuda
dataset:
  batch_size: 128
  dim_x: 11
  dim_y: 10
  forecast_length: 200
  history_length: 50
  name: IndPenSim
  scaler: minmax
  scaler_params_content: null
  stride: 200
experiment:
  batch_size: 512
  failure_policy:
    divergent_prediction_is_failure: true
    max_abs_loss: 1000000000000.0
    max_abs_prediction: 1000000.0
    non_finite_is_failure: true
  hyperparameter_tuning:
    jobs_per_gpu: 1
    min_epochs: 750
    n_jobs: -1
    n_trials: 100
    num_epochs: 750
    reduction_factor: 2
    use_pruner: false
  num_epochs: 1000
  seed: 42
  wanted_device: cuda
model:
  activation_ODE: leaky_relu
  activation_decoder: tanh
  adjoint: false
  atol: 0.0001
  fallback_on_nan_dt: false
  fallback_solver: rk4
  fallback_step_size: 0.001
  hidden_size_ODE: 80
  hidden_size_decoder: 104
  hidden_size_encoder: 112
  homogeneous: false
  include_time: true
  interp_mode: linear
  latent_dim_ODE: 8
  learning_rate: 0.0037525975272098863
  n_layers_hidden_ODE: 4
  n_layers_hidden_decoder: 2
  name: M4AdaptiveNeuralODE
  num_layers_encoder: 2
  pretraining_epochs: 0
  pretraining_lr: 0
  pretraining_scaling: false
  rnn_type: lstm
  rtol: 1.0e-07
  scaler_params:
    exclude_columns:
    - Time (h)
    - Batch reference(Batch_ref:Batch ref)
    scaled_columns:
    - Aeration rate(Fg:L/h)
    - Agitator RPM(RPM:RPM)
    - Sugar feed rate(Fs:L/h)
