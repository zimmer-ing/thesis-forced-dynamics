# Nano-Drone benchmark: 100 Hz data, 0.25 s history and 0.5 s forecast.
# Run-grouped in-distribution split: all trajectory families are represented in
# train/val/test, but complete runs are held out for validation/test.
stride: 10
history_length: 25
forecast_length: 50
batch_size: 512
dim_x: 4
dim_y: 12
scaler: "minmax"
