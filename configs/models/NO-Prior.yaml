has_physics: True

hidden_size_ODE:
  default: 16
  search_space:
    type: "int"
    low: 8
    high: 256
    step: 8

n_layers_hidden_ODE:
  default: 2
  search_space:
    type: "categorical"
    choices: [1, 2, 3, 4]

activation_ODE:
  default: "tanh"
  search_space:
        type: "categorical"
        choices: ["relu", "leaky_relu", "tanh", "elu", "sigmoid", "none"]

include_time:
    default: false
    search_space:
        type: "categorical"
        choices: [true, false]

homogeneous:
  default: false

interp_mode:
  default: "linear"


pretraining_scaling:
  default: true

adjoint:
  default: false

solver:
  default: "dopri5"
atol:
  default: 1e-4
rtol:
  default: 1e-7

fallback_on_nan_dt:
  default: false

fallback_solver:
  default: "rk4"

fallback_step_size:
  default: 1e-3


pretraining_epochs:
  default: 1000


pretraining_lr:
  default: 0.00001
  search_space:
    type: "loguniform"
    low: 1e-5
    high: 1e-2


learning_rate:
  default: 0.001
  search_space:
    type: "loguniform"
    low: 1e-5
    high: 1e-2
