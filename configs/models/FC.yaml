hidden_width:
  default: 512
  search_space:
    type: "int"
    low: 64
    high: 1024
    step: 64

hidden_layers:
  default: 2
  search_space:
    type: "int"
    low: 0
    high: 4
    step: 1

activation:
  default: "ReLU"
  search_space:
    type: "categorical"
    choices: ["ReLU", "LeakyReLU", "ELU", "Sigmoid"]

use_dt:
  default: false

response_only_history:
  default: false

learning_rate:
  default: 0.001
  search_space:
    type: "loguniform"
    low: 1e-5
    high: 1e-2
