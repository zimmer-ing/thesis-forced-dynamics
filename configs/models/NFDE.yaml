hidden_size_FDE:
  default: 100
  search_space:
    type: "int"
    low: 8
    high: 150
    step: 8

n_layers_hidden_FDE:
  default: 2
  search_space:
    type: "categorical"
    choices: [1, 2, 3, 4]

activation_FDE:
  default: "relu"
  search_space:
    type: "categorical"
    choices: ["relu", "leaky_relu", "tanh", "elu", "sigmoid", "none"]

include_time:
  default: true
  search_space:
    type: "categorical"
    choices: [true, false]

homogeneous:
  default: false

interp_mode:
  default: "linear"

# Known order of the synthetic fractional benchmark.
alpha:
  default: 0.7

learn_alpha:
  default: false

h:
  default: null

learning_rate:
  default: 0.001
  search_space:
    type: "loguniform"
    low: 1e-5
    high: 1e-2
