base:
  seed: 42
  wanted_device: "cuda"          # Device to use for training and evaluation
  hyperparameter_tuning:
    n_trials: 100     # Number of hyperparameter tuning trials
    n_jobs: -1         # Number of parallel jobs for hyperparameter tuning (-1 for all CPUs or jobs_per_gpu * num_gpus)
    jobs_per_gpu: 1   # Number of parallel jobs per GPU in case of GPU usage
    num_epochs: 750  # Number of epochs to train the model for each trial
    use_pruner: false  # Whether to use pruner for early stopping
    min_epochs: 500   # Minimum number of epochs to train the model for each trial before the pruner starts
    reduction_factor: 2  # strictness of the pruner (lower is less strict)

  num_epochs: 1000
  batch_size: 512
  failure_policy:
    non_finite_is_failure: true
    divergent_prediction_is_failure: true
    max_abs_prediction: 1e6
    max_abs_loss: 1e12

# Dataset dependent parameters

IndPenSim:
  hyperparameter_tuning:
    num_epochs: 750
    min_epochs: 750
  num_epochs: 1000

RLCDataset:
  hyperparameter_tuning:
    num_epochs: 500
    min_epochs: 500
  num_epochs: 1000
